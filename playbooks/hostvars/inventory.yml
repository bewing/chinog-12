network:
  vars:
    ansible_user: admin
    ansible_password: admin
  hosts:
    clab-chinog-ceos:
      ansible_network_os: arista.eos.eos
      ansible_connection: ansible.netcommon.httpapi
      ansible_httpapi_use_ssl: yes
      ansible_httpapi_validate_certs: no
      ntp_config:
        local_interface: Ethernet1
        authentication_keys:
        - algorithm: md5
          encryption: 7
          id: 2
          key: "0832595E0C0B161211190910"
        servers:
        - server: 1.2.3.4
          key_id: 2
        - server: 4.3.2.1
          key_id: 2
    clab-chinog-iol:
      ansible_network_os: cisco.ios.ios
      ansible_connection: ansible.netcommon.network_cli
      ntp_config:
        source: Ethernet0/0
        authentication_keys:
        - algorithm: md5
          encryption: 7
          id: 2
          key: "0832595E0C0B161211190910"
        servers:
        - server: 1.2.3.4
          key_id: 2
        - server: 4.3.2.1
          key_id: 2
